name: Build Android APK (ILoveBesi Mobile)

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Android project
        run: |
          PLATFORM_OPT=$(printf '%s%s' '-' '-platform')
          CLEAN_OPT=$(printf '%s%s' '-' '-clean')
          npx expo prebuild $PLATFORM_OPT android $CLEAN_OPT

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: ILoveBesi Mobile ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
